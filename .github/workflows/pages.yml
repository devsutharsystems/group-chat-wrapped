# Publishes the committed, pre-built site/ folder unchanged (no build step). Requires Settings > Pages > Source: GitHub Actions.
# Action versions follow the usage examples in the READMEs of actions/upload-pages-artifact (v3) and actions/deploy-pages (v4).
# UNVERIFIED until the first run: this workflow cannot run on the machine it was written on.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
