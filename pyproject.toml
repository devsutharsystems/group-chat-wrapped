[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-chat-wrapped"
version = "0.0.0"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt (the single source of truth); install those first.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcw = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "synthetic"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: starts a real Chromium in a child process; run alone with `pytest -m slow` (one Chromium at a time)"]
